<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявки — Дента Плюс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin { padding: 40px 0 80px; }
  .admin__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .stat b { display: block; font: 500 26px "Unbounded", sans-serif; }
  .stat span { color: var(--muted); font-size: 14px; }
  .notify { display: flex; gap: 12px; align-items: center; background: #e8f1fb; border: 1px solid #c9dcf2; border-radius: 14px; padding: 14px 18px; margin-bottom: 24px; font-size: 15px; }
  .notify__ic { flex: none; width: 36px; height: 36px; border-radius: 50%; background: #2aa3e0; color: #fff; display: grid; place-items: center; font-weight: 800; }
  .list { display: grid; gap: 12px; }
  .req { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
  .req__who { font-weight: 800; font-size: 17px; }
  .req__meta { color: var(--muted); font-size: 14px; }
  .req__what { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
  .req__what span { font-size: 14px; padding: 4px 10px; border-radius: 8px; background: var(--bg-alt); }
  .req__comment { grid-column: 1 / -1; margin: 0; font-size: 15px; }
  .req__actions { display: flex; gap: 8px; align-items: start; }
  .badge { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .badge--new { background: #fff1d6; color: #8a5a00; }
  .badge--done { background: var(--accent-soft); color: var(--accent); }
  .empty { text-align: center; padding: 48px 20px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr 1fr 1fr; } .stat b { font-size: 20px; } .req { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="demo-bar">Демо · так администратор клиники видит заявки с сайта · <a href="index.html">вернуться на сайт</a></div>

<header class="header">
  <div class="wrap header__in">
    <a class="logo" href="index.html"><span class="logo__mark">+</span>Дента Плюс</a>
    <span class="nav" style="display:flex">Панель администратора</span>
  </div>
</header>

<main class="admin">
  <div class="wrap">
    <div class="admin__head">
      <h2>Заявки</h2>
      <a class="btn btn--sm" href="index.html#booking">+ Тестовая заявка</a>
    </div>

    <div class="notify">
      <div class="notify__ic">✈</div>
      <div>Каждая новая заявка также приходит администратору в Telegram — с именем, телефоном, услугой и временем.</div>
    </div>

    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>всего</span></div>
      <div class="stat"><b id="sNew">0</b><span>новых</span></div>
      <div class="stat"><b id="sDone">0</b><span>обработано</span></div>
    </div>

    <div class="list" id="list"></div>
  </div>
</main>

<script>
const KEY = "denta_requests";
const SAMPLE = [
  { id: 1, createdAt: new Date(Date.now() - 36e5).toISOString(), service: "Чистка зубов", doctor: "Елена Орлова — гигиенист", day: "", time: "16:30", name: "Мария", phone: "+7 (912) 000-00-01", comment: "", status: "done" },
  { id: 2, createdAt: new Date(Date.now() - 2 * 36e5).toISOString(), service: "Острая боль", doctor: "Любой свободный", day: "", time: "12:00", name: "Сергей", phone: "+7 (912) 000-00-02", comment: "Болит зуб справа сверху, второй день", status: "new" },
];

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function save(items) {
  try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {}
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function dayLabel(r) {
  if (!r.day) return "сегодня";
  const [y, m, d] = r.day.split("-").map(Number);
  return new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", weekday: "short" }).format(new Date(y, m - 1, d));
}
function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (min < 1) return "только что";
  if (min < 60) return `${min} мин назад`;
  return `${Math.round(min / 60)} ч назад`;
}

function render() {
  const own = load();
  const items = [...own, ...SAMPLE];
  const list = document.getElementById("list");
  list.replaceChildren();
  document.getElementById("sTotal").textContent = items.length;
  document.getElementById("sNew").textContent = items.filter((r) => r.status === "new").length;
  document.getElementById("sDone").textContent = items.filter((r) => r.status === "done").length;

  for (const r of items) {
    const card = el("article", "req");
    const left = el("div");
    left.append(el("div", "req__who", `${r.name} · ${r.phone}`));
    left.append(el("div", "req__meta", `Заявка ${ago(r.createdAt)}`));
    const actions = el("div", "req__actions");
    const badge = el("span", `badge badge--${r.status}`, r.status === "new" ? "Новая" : "Подтверждена");
    actions.append(badge);
    const isOwn = own.some((o) => o.id === r.id);
    if (r.status === "new" && isOwn) {
      const b = el("button", "btn btn--sm", "Подтвердить");
      b.addEventListener("click", () => {
        save(own.map((o) => (o.id === r.id ? { ...o, status: "done" } : o)));
        render();
      });
      actions.append(b);
    }
    const what = el("div", "req__what");
    what.append(el("span", "", r.service), el("span", "", `${dayLabel(r)}, ${r.time}`), el("span", "", r.doctor));
    card.append(left, actions, what);
    if (r.comment) card.append(el("p", "req__comment", `«${r.comment}»`));
    list.append(card);
  }
}
render();
</script>
</body>
</html>
